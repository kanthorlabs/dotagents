apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: checkout-api
          image: registry.copperline.example/checkout-api:2026.10.4
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8080"]
