server {
    listen 443 ssl;
    server_name docs.pinewood.example;

    ssl_certificate     /etc/ssl/pinewood/fullchain.pem;
    ssl_certificate_key /etc/ssl/pinewood/privkey.pem;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://pinewood-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /srv/pinewood/web;
        try_files $uri /index.html;
    }
}
